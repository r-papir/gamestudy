<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEP-Bench — Puzzle 1</title>
    <link rel="icon" href="mascot.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        #game-container {
            text-align: center;
            position: relative;
        }

        #ripple-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            border: 7px solid #32CD32;
            opacity: 2;
        }

        @keyframes ripple {
            0% {
                width: 0;
                height: 0;
                opacity: 0;
            }
            10% {
                width: 40px;
                height: 40px;
                opacity: 0.8;
            }
            100% {
                width: 400px;
                height: 400px;
                opacity: 0;
            }
        }

        #level-info {
            margin-bottom: 20px;
            font-size: 18px;
        }

        #instructions {
            margin-bottom: 20px;
            font-size: 18px;
            padding: 15px;
            color: var(--ink);
            border-radius: 8px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.5;
            text-align: center;
            opacity: 1;
            transition: opacity 1s ease-in-out;
        }

        #instructions.fade-out {
            opacity: 0;
        }

        #avatar-color-display {
            margin-bottom: 15px;
            font-size: 16px;
            padding: 10px;
            background-color: #1a1a1a57;
            border-radius: 5px;
        }

        #color-indicator {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 2px solid #666;
            vertical-align: middle;
            margin-left: 10px;
        }

        #grid {
            display: inline-grid;
            grid-template-columns: repeat(6, 90px);
            grid-template-rows: repeat(6, 90px);
            gap: 2px;
            background-color: #e0e0e0;
            padding: 2px;
            border: 3px solid #e0e0e0;
            opacity: 1;
            transition: opacity 1s ease-in-out;
        }

        #grid.fade-out {
            opacity: 0;
        }

        #button-container {
            display: none;
        }

        /* Appearance comes from puzzle-theme.css; these rules are position only.
           #download-button lives inside the dashboard. */
        #restart-button, #skip-button {
            position: fixed;
            z-index: 1000;
        }

        /* Bottom-left, shown only once the game is complete. */
        #restart-button {
            left: 20px;
            bottom: 20px;
            display: none;
        }

        /* Bottom-right corner, shown while playing. */
        #skip-button {
            right: 20px;
            bottom: 20px;
            display: block;
        }

        .audio-recorder-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            text-align: right;
        }

        .cell {
            width: 90px;
            height: 90px;
            border: 1px solid #e0e0e0;
            box-sizing: border-box;
        }

        /* Hide WebGazer camera elements during gameplay */
        #webgazerVideoFeed,
        #webgazerVideoCanvas,
        #webgazerFaceFeedbackBox,
        #webgazerGazeDot {
            display: none !important;
        }

        .completion-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.5s ease;
            cursor: pointer;
        }
        .completion-overlay.visible { opacity: 1; }
        .completion-card {
            padding: 48px 56px;
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .completion-overlay.visible .completion-card { transform: scale(1); }
        .completion-card h2 {
            margin: 0 0 12px;
            font-size: 28px;
        }
        .completion-card p {
            margin: 0;
            font-size: 16px;
        }
        .confetti-piece {
            position: fixed;
            top: -10px;
            width: 10px;
            height: 14px;
            z-index: 10000;
            opacity: 1;
            animation: confetti-fall linear forwards;
        }
        @keyframes confetti-fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            85% { opacity: 1; }
            100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
        }
    </style>
    <link rel="stylesheet" href="puzzle-theme.css">
</head>
<body>
    <script>
    // Verify calibration before allowing game play
    (function() {
        var calibrated = sessionStorage.getItem('webgazerCalibrationComplete') === 'true';
        var skipped = sessionStorage.getItem('eyeTrackingSkipped') === 'true';
        if (!calibrated && !skipped) {
            var returnUrl = encodeURIComponent(window.location.pathname);
            window.location.href = 'calibration.html?return=' + returnUrl;
        }
    })();
    </script>

                <option value="game.html" selected>Puzzle 1</option>

    <script>S3Uploader.setApiUrl('https://n00wf4nmw6.execute-api.us-east-1.amazonaws.com/prod');</script>
    <script>
        // Get or generate shared 4-digit session code (persists across all games in same session)
        let sessionCode = sessionStorage.getItem('gameSessionCode');
        if (!sessionCode) {
            sessionCode = String(Math.floor(1000 + Math.random() * 9000));
            sessionStorage.setItem('gameSessionCode', sessionCode);
        }

        // Color definitions
        const COLORS = {
            EMPTY: '#FFFFFF',
            GREY: '#D3D3D3',  // Avatar is grey
            BLUE: '#ADD8E6',
            YELLOW: '#DDCC77',
            TEAL: '#44AA99',
            PINK: '#CC6677',
            LIME: '#BBCC33',
            ORANGE: '#FF8438',
            MAGENTA: '#882255',   // from game2new.html
            LAVENDER: '#DAB1DA'   // from game5.html
        };

        // Game state
        let levels = [];
        let currentLevelIndex = 0;
        let gameState = {
            grid: [],
            avatarPos: { x: 1, y: 1 },
            avatarColor: 'grey',  // Track avatar color
            centerPos: { x: 1, y: 1 },  // Blue center box
            targetColor: 'blue',  // Color needed to win
            corners: {
                originTopLeft: { x: 1, y: 1, color: 'teal' },      // teal (reset)
                originTopRight: { x: 6, y: 1, color: 'yellow' },    // Yellow
                originbBottomLeft: { x: 1, y: 6, color: 'pink' },    // Pink
                originBottomRight: { x: 6, y: 6, color: 'blue' }    // Blue
            },
            moveCount: 0,
            colorHistory: ['grey'],  // Track color transitions
            levelComplete: false  // Prevent movement after winning
        };

        // Data collection
        let sessionData = {
            game: "Game A",
            legend: {
                "E": "Empty - background cell",
                "G": "Goal - destination the avatar must reach",
                "C": "Color - a color box that does not match the goal color",
                "M": "Match - the color box that matches the goal color",
                "A": "Avatar - the player's piece",
                "R": "Reset - the teal box that resets avatar to grey"
            },
            coordinates: {
                "grid": "6x6 grid",
                "origin": "(1,1) is the top-left corner (1-based)",
                "x": "column, increases left to right (1-6)",
                "y": "row, increases top to bottom (1-6)",
                "dx": "-1 = left, +1 = right, 0 = no horizontal movement",
                "dy": "-1 = up, +1 = down, 0 = no vertical movement"
            },
            sessionStart: new Date().toISOString(),
            movements: [],
            skips: []
        };

        // Initialize grid display
        function initGrid() {
            const gridElement = document.getElementById('grid');
            gridElement.innerHTML = '';
            // 1-based coordinates: cells run (1,1)..(6,6)
            for (let y = 1; y <= 6; y++) {
                for (let x = 1; x <= 6; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.id = `cell-${x}-${y}`;
                    gridElement.appendChild(cell);
                }
            }
        }

        // Load level
        function loadLevel(levelIndex) {
            if (levelIndex >= levels.length) {
                return;
            }

            const dashLevel = document.getElementById('dash-level');
            if (dashLevel) dashLevel.textContent = levelIndex + 1;

            const level = levels[levelIndex];
            gameState.grid = level.grid.map(row => [...row]);
            gameState.avatarPos = { ...level.avatar };
            gameState.centerPos = { ...level.center };
            gameState.corners = JSON.parse(JSON.stringify(level.corners)); // Deep copy corners
            gameState.targetColor = level.targetColor || 'blue';  // Default to blue if not specified
            gameState.avatarColor = level.initialAvatarColor || 'grey';
            gameState.colorHistory = [level.initialAvatarColor || 'grey'];
            gameState.moveCount = 0;
            gameState.levelComplete = false;

            // Update instructions display
            const instructionsElement = document.getElementById('instructions');
            if (level.instructions) {
                instructionsElement.innerHTML = level.instructions;
                instructionsElement.style.display = 'block';
            } else {
                instructionsElement.style.display = 'none';
            }

            renderGrid();

            // Fade in the new level
            const gridElement = document.getElementById('grid');
            gridElement.classList.remove('fade-out');
            instructionsElement.classList.remove('fade-out');

            // Skip Level is available whenever a level is in play
            document.getElementById('skip-button').style.display = 'block';
        }

        // Get color at position
        function getColorAtPosition(x, y) {
            // Check corners dynamically
            for (const cornerKey in gameState.corners) {
                const corner = gameState.corners[cornerKey];
                if (x === corner.x && y === corner.y) {
                    // Teal corner resets to grey, others return their color
                    return corner.color === 'teal' ? 'grey' : corner.color;
                }
            }

            // Check center
            if (x === gameState.centerPos.x && y === gameState.centerPos.y) return 'center';

            return null;
        }

        // Render the grid
        function renderGrid() {
            for (let y = 1; y <= 6; y++) {
                for (let x = 1; x <= 6; x++) {
                    const cell = document.getElementById(`cell-${x}-${y}`);
                    let color = COLORS.EMPTY;

                    // Draw corner blocks dynamically
                    let isCorner = false;
                    for (const cornerKey in gameState.corners) {
                        const corner = gameState.corners[cornerKey];
                        if (x === corner.x && y === corner.y) {
                            color = COLORS[corner.color.toUpperCase()];
                            isCorner = true;
                            break;
                        }
                    }

                    // Draw center block
                    if (!isCorner && x === gameState.centerPos.x && y === gameState.centerPos.y) {
                        color = COLORS[gameState.targetColor.toUpperCase()];
                    }

                    // Draw avatar (on top)
                    if (gameState.avatarPos.x === x && gameState.avatarPos.y === y) {
                        color = COLORS[gameState.avatarColor.toUpperCase()];
                    }

                    cell.style.backgroundColor = color;
                }
            }
        }

        // Check if position is a corner block
        function isCornerBlock(x, y) {
            for (const cornerKey in gameState.corners) {
                const corner = gameState.corners[cornerKey];
                if (x === corner.x && y === corner.y) {
                    return true;
                }
            }
            return false;
        }

        // Check if avatar is adjacent to a corner
        function checkAdjacentCorners(x, y) {
            // Check all 4 adjacent positions
            const adjacents = [
                { x: x - 1, y: y },  // left
                { x: x + 1, y: y },  // right
                { x: x, y: y - 1 },  // up
                { x: x, y: y + 1 }   // down
            ];

            for (const adj of adjacents) {
                const colorAt = getColorAtPosition(adj.x, adj.y);
                if (colorAt && colorAt !== 'center') {
                    return colorAt;
                }
            }
            return null;
        }

        // Check if position is valid
        function isValidPosition(x, y) {
            if (x < 1 || x > 6 || y < 1 || y > 6) return false;
            // Cannot move onto corner blocks
            if (isCornerBlock(x, y)) return false;
            // Cannot move onto center block
            if (x === gameState.centerPos.x && y === gameState.centerPos.y) return false;
            return true;
        }

        // Check win condition
        function checkWinCondition() {
            // Must be adjacent to center position (not on it)
            const dx = Math.abs(gameState.avatarPos.x - gameState.centerPos.x);
            const dy = Math.abs(gameState.avatarPos.y - gameState.centerPos.y);
            const isAdjacent = (dx === 1 && dy === 0) || (dx === 0 && dy === 1);

            if (!isAdjacent) {
                return false;
            }

            // Must be the target color
            if (gameState.avatarColor !== gameState.targetColor) {
                return false;
            }

            // Check color history: must go grey -> target color -> center
            const history = gameState.colorHistory;

            // Find the last time we were grey
            let lastGreyIndex = -1;
            for (let i = history.length - 1; i >= 0; i--) {
                if (history[i] === 'grey') {
                    lastGreyIndex = i;
                    break;
                }
            }

            // Check if we went directly from grey to target color (no other colors in between)
            if (lastGreyIndex === -1) return false;

            for (let i = lastGreyIndex + 1; i < history.length; i++) {
                if (history[i] !== gameState.targetColor) {
                    return false;
                }
            }

            return true;
        }

        // Move avatar
        function moveAvatar(dx, dy) {
            // Prevent movement after level is complete
            if (gameState.levelComplete) {
                return;
            }

            const newX = gameState.avatarPos.x + dx;
            const newY = gameState.avatarPos.y + dy;

            if (!isValidPosition(newX, newY)) {
                return;
            }

            // Move avatar
            gameState.avatarPos.x = newX;
            gameState.avatarPos.y = newY;
            gameState.moveCount++;

            // Check if avatar is now adjacent to a color-changing corner
            const adjacentColor = checkAdjacentCorners(newX, newY);

            if (adjacentColor) {
                gameState.avatarColor = adjacentColor;
                gameState.colorHistory.push(adjacentColor);
            }

            renderGrid();

            // Check win condition after every move
            if (checkWinCondition()) {
                // Lock movement immediately
                gameState.levelComplete = true;

                // Create ripple effect
                createRipple();

                const gridElement = document.getElementById('grid');
                const instructionsElement = document.getElementById('instructions');

                // Delay before fade-out so player can see the solution
                setTimeout(() => {
                    // Fade out
                    gridElement.classList.add('fade-out');
                    instructionsElement.classList.add('fade-out');

                    setTimeout(() => {
                        currentLevelIndex++;
                        if (currentLevelIndex < levels.length) {
                            loadLevel(currentLevelIndex);
                        } else {
                            // Game complete - show restart button and upload data
                            gridElement.classList.remove('fade-out');
                            instructionsElement.classList.remove('fade-out');
                            document.getElementById('skip-button').style.display = 'none';
                            document.getElementById('restart-button').style.display = 'block';
                            handleGameComplete();
                            showCompletionMessage('1');
                        }
                    }, 1200);
                }, 800);
            }
        }

        function showCompletionMessage(puzzleLetter) {
            const overlay = document.createElement('div');
            overlay.className = 'completion-overlay';
            overlay.innerHTML = '<div class="completion-card">' +
                '<h2>Congratulations!</h2>' +
                '<p>You completed all levels of Puzzle ' + puzzleLetter + '.</p>' +
                '</div>';
            document.body.appendChild(overlay);
            requestAnimationFrame(() => overlay.classList.add('visible'));

            const colors = ['#e53935','#1e88e5','#43a047','#fdd835','#8e24aa','#fb8c00','#00acc1'];
            for (let i = 0; i < 80; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = Math.random() * 100 + 'vw';
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.animationDuration = (2 + Math.random() * 2) + 's';
                piece.style.animationDelay = Math.random() * 1.5 + 's';
                piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                piece.style.width = (6 + Math.random() * 8) + 'px';
                piece.style.height = (8 + Math.random() * 10) + 'px';
                document.body.appendChild(piece);
            }

            overlay.addEventListener('click', () => {
                overlay.classList.remove('visible');
                setTimeout(() => {
                    overlay.remove();
                    document.querySelectorAll('.confetti-piece').forEach(p => p.remove());
                }, 500);
            });
        }

        // Create ripple effect on win
        function createRipple() {
            const container = document.getElementById('ripple-container');

            // Create multiple ripples with delays
            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    const ripple = document.createElement('div');
                    ripple.className = 'ripple';
                    ripple.style.animation = 'ripple 1s ease-out';
                    container.appendChild(ripple);

                    // Remove ripple after animation
                    setTimeout(() => {
                        ripple.remove();
                    }, 1000);
                }, i * 200);
            }
        }

        // Generate game state matrix
        // matrix is a plain 0-based array; coordinates are 1-based, so index with -1.
        function generateGameStateMatrix() {
            // Initialize 6x6 matrix with empty cells
            const matrix = Array(6).fill(null).map(() => Array(6).fill('E'));

            // Place corners with new letter codes:
            // R = Reset (teal), M = Match (matches target color), C = Color (other colors)
            for (const cornerKey in gameState.corners) {
                const corner = gameState.corners[cornerKey];
                let code;
                if (corner.color === 'teal') {
                    code = 'R'; // Reset color box
                } else if (corner.color === gameState.targetColor) {
                    code = 'M'; // Match - this color matches the goal
                } else {
                    code = 'C'; // Color - doesn't match goal
                }
                matrix[corner.y - 1][corner.x - 1] = code;
            }

            // Place goal (center) with 'G'
            matrix[gameState.centerPos.y - 1][gameState.centerPos.x - 1] = 'G';

            // Place avatar with 'A' (on top of everything)
            matrix[gameState.avatarPos.y - 1][gameState.avatarPos.x - 1] = 'A';

            return matrix;
        }

        // Log movement data
        function logMovement(key, direction, dx, dy) {
            const movementData = {
                timestamp: new Date().toISOString(),
                level: currentLevelIndex + 1,
                key: key,
                direction: direction,
                positionBefore: { x: gameState.avatarPos.x, y: gameState.avatarPos.y },
                colorBefore: gameState.avatarColor,
                delta: { dx: dx, dy: dy },
                gameStateBefore: generateGameStateMatrix()
            };
            sessionData.movements.push(movementData);
        }

        // Handle keyboard input
        document.addEventListener('keydown', (e) => {
            if (currentLevelIndex >= levels.length) return;

            switch(e.key) {
                case 'ArrowUp':
                    e.preventDefault();
                    logMovement('ArrowUp', 'up', 0, -1);
                    moveAvatar(0, -1);
                    fetch('http://localhost:5000/update_state', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(buildAgentState()) });
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    logMovement('ArrowDown', 'down', 0, 1);
                    moveAvatar(0, 1);
                    fetch('http://localhost:5000/update_state', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(buildAgentState()) });
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    logMovement('ArrowLeft', 'left', -1, 0);
                    moveAvatar(-1, 0);
                    fetch('http://localhost:5000/update_state', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(buildAgentState()) });
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    logMovement('ArrowRight', 'right', 1, 0);
                    moveAvatar(1, 0);
                    fetch('http://localhost:5000/update_state', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(buildAgentState()) });
                    break;
                case 'r':
                case 'R':
                    e.preventDefault();
                    loadLevel(currentLevelIndex);
                    break;
            }
        });

        // Handle restart button click
        document.getElementById('restart-button').addEventListener('click', () => {
            currentLevelIndex = 0;
            document.getElementById('restart-button').style.display = 'none';
            loadLevel(currentLevelIndex);
        });

        // Handle skip button click - advance to the next level without solving
        // it. Mirrors the win transition (same fade + timing) but records a skip
        // instead of a win, and skips the ripple.
        document.getElementById('skip-button').addEventListener('click', () => {
            if (currentLevelIndex >= levels.length) return;
            if (gameState.levelComplete) return;  // a transition is already running

            gameState.levelComplete = true;  // lock movement during the fade
            sessionData.skips.push({
                timestamp: new Date().toISOString(),
                level: currentLevelIndex + 1,
                gameStateBefore: generateGameStateMatrix()
            });

            const gridElement = document.getElementById('grid');
            const instructionsElement = document.getElementById('instructions');
            gridElement.classList.add('fade-out');
            instructionsElement.classList.add('fade-out');

            setTimeout(() => {
                currentLevelIndex++;
                if (currentLevelIndex < levels.length) {
                    loadLevel(currentLevelIndex);
                } else {
                    gridElement.classList.remove('fade-out');
                    instructionsElement.classList.remove('fade-out');
                    document.getElementById('skip-button').style.display = 'none';
                    document.getElementById('restart-button').style.display = 'block';
                    handleGameComplete();
                    showCompletionMessage('1');
                }
            }, 1200);
        });

        // Handle download button click
        document.getElementById('download-button').addEventListener('click', () => {
            const participantId = AudioRecorder.promptParticipantId();
            if (participantId === null) return;

            // Add session end time
            sessionData.sessionEnd = new Date().toISOString();

            // Include transcription data from audio recorder (with safety check)
            sessionData.transcription = (typeof AudioRecorder !== 'undefined' && AudioRecorder.getTranscription)
                ? AudioRecorder.getTranscription()
                : [];

            // Convert to JSON with standard formatting first
            let dataStr = JSON.stringify(sessionData, null, 2);

            // Post-process to compress gameStateBefore arrays into compact rows
            // Find each gameStateBefore array and compress its rows
            dataStr = dataStr.replace(
                /"gameStateBefore":\s*\[\s*\[\s*("[A-Z]",?\s*)+\]\s*(,\s*\[\s*("[A-Z]",?\s*)+\]\s*)*\]/g,
                (match) => {
                    // Extract all letters from this matrix
                    const letters = match.match(/"[A-Z]"/g);
                    if (!letters) return match;

                    // Group into rows of 6
                    const rows = [];
                    for (let i = 0; i < letters.length; i += 6) {
                        rows.push('[' + letters.slice(i, i + 6).join(',') + ']');
                    }

                    // Format with proper indentation
                    return '"gameStateBefore": [\n        ' + rows.join(',\n        ') + '\n      ]';
                }
            );

            // Create blob and download
            const dateStr = AudioRecorder.formatDateMMDDYYYY();
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${participantId}_gA_gamestate_${dateStr}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            // Export eye-tracking and audio files
            if (typeof AudioRecorder !== 'undefined' && AudioRecorder.exportRecording) {
                AudioRecorder.exportRecording(participantId, 'gA');
            }
        });

            let statusEl = document.getElementById('upload-status');
            if (!statusEl) {
                statusEl = document.createElement('div');
                statusEl.id = 'upload-status';
                statusEl.style.cssText = 'position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 12px 24px; background: #333; color: white; border-radius: 8px; z-index: 1000; font-family: sans-serif; font-size: 14px; transition: opacity 0.3s;';
                document.body.appendChild(statusEl);
            }
            statusEl.textContent = message;
            statusEl.style.background = type === 'success' ? '#2e7d32' : type === 'error' ? '#c62828' : '#1565c0';
        }

        async function handleGameComplete() {
            // Prepare session data
            sessionData.sessionEnd = new Date().toISOString();
            sessionData.transcription = (typeof AudioRecorder !== 'undefined' && AudioRecorder.getTranscription)
                ? AudioRecorder.getTranscription()
                : [];

            // Get eye tracking and audio data from AudioRecorder
            const recorderState = (typeof AudioRecorder !== 'undefined' && AudioRecorder.getState)
                ? AudioRecorder.getState()
                : { gazeData: [], audioChunks: [] };

            const eyeTrackingData = {
                game: sessionData.game,
                dataType: 'eye-tracking',
                sessionStart: sessionData.sessionStart,
                sessionEnd: sessionData.sessionEnd,
                gaze: recorderState.gazeData || []
            };

            // Check if S3Uploader is configured
            if (typeof S3Uploader === 'undefined' || !S3Uploader.getApiUrl()) {
                console.log('S3Uploader not configured. Skipping upload.');
                return;
            }

            // Upload to S3
            showUploadStatus('Uploading session data...', 'uploading');

            const result = await S3Uploader.upload(
                sessionCode,
                sessionData.game,
                sessionData,
                eyeTrackingData,
                recorderState.audioChunks,
                (status) => showUploadStatus(status, 'uploading')
            );

            if (result.success) {
                showUploadStatus('Data uploaded successfully!', 'success');
                setTimeout(() => {
                    const statusEl = document.getElementById('upload-status');
                    if (statusEl) statusEl.style.opacity = '0';
                }, 3000);
            } else {
                showUploadStatus('Upload failed. Use Download button as backup.', 'error');
            }
        }

                    centerPos: { ...gameState.centerPos },
                    colorHistory: [...gameState.colorHistory],
                    moveCount: gameState.moveCount,
                    gameStateMatrix: generateGameStateMatrix()
                };
            },
            screenToGrid: function(screenX, screenY) {
                const grid = document.getElementById('grid');
                const rect = grid.getBoundingClientRect();

                // Check if point is within grid bounds
                if (screenX < rect.left || screenX > rect.right ||
                    screenY < rect.top || screenY > rect.bottom) {
                    return null; // Off grid
                }

                // Convert to grid coordinates (1-6 for 6x6 grid, 1-based)
                const cellWidth = rect.width / 6;
                const cellHeight = rect.height / 6;
                const gridX = Math.floor((screenX - rect.left) / cellWidth) + 1;
                const gridY = Math.floor((screenY - rect.top) / cellHeight) + 1;

                return { x: Math.min(gridX, 6), y: Math.min(gridY, 6) };
            },
            insertBeforeSelector: '#dashboard',
            onRecordingStart: () => {
                S3Uploader.startBackups(sessionCode, 'Game A', () => AudioRecorder.getState().audioChunks);
            },
            onRecordingStop: () => {

    <script>
        // Dashboard puzzle switcher - confirm with a "Quit puzzle?" dialog
        // before navigating away (Home included).
        (function () {
            var select = document.getElementById('dash-puzzle');
            var home = document.getElementById('dash-home');
            var overlay = document.getElementById('quit-overlay');
            if (!overlay) return;
            var CURRENT = 'game.html';
            var pending = null;

            function askQuit(target) {
                pending = target;
                overlay.hidden = false;
                requestAnimationFrame(function () { overlay.classList.add('visible'); });
            }

            if (select) select.addEventListener('change', function () {
                var target = this.value;
                this.value = CURRENT;                 // revert until confirmed
                if (target && target !== CURRENT) askQuit(target);
            });

            if (home) home.addEventListener('click', function (e) {
                e.preventDefault();
                askQuit(home.getAttribute('href') || 'index.html');
            });

            document.getElementById('quit-confirm').addEventListener('click', function () {
                if (pending) window.location.href = pending;
            });
            document.getElementById('quit-cancel').addEventListener('click', function () {
                overlay.classList.remove('visible');
                setTimeout(function () { overlay.hidden = true; }, 400);
                pending = null;
            });
        })();
    </script>
