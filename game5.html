    <script>
    // ---- Puzzle 5 authorization gate ----
    // Must be the first script on the page. If the visitor has not entered the
    // authorization code this session, cover the page with a full-screen code
    // prompt and set window.__puzzle5Unauthorized so the calibration check and
    // the game "Start" block below do not run. On the correct code we store a
    // session flag and reload for a clean start.
    //
    // This deliberately avoids document.open()/document.write(): those are a
    // no-op when called from an inline script while the parser is still active
    // (HTML spec: script nesting level > 0), which left the old gate injecting
    // broken markup into a half-parsed page. An overlay appended to the DOM
    // works regardless of parser state.
    (function () {
        var AUTH_CODE = 'ABCD';

        var authorized = false;
        try { authorized = sessionStorage.getItem('puzzle5Authorized') === 'true'; } catch (e) {}
        if (authorized) return;

        window.__puzzle5Unauthorized = true;

        function buildGate() {
            if (document.getElementById('p5-auth-overlay')) return;

            var overlay = document.createElement('div');
            overlay.id = 'p5-auth-overlay';
            overlay.setAttribute('style', [
                'position:fixed', 'inset:0', 'z-index:2147483647',
                'display:flex', 'align-items:center', 'justify-content:center',
                'background:#F9F9F6',
                "font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"
            ].join(';'));
            overlay.innerHTML =
                '<div style="width:360px;max-width:88vw;text-align:center;padding:24px;">' +
                '<h1 style="font-family:\'Silkscreen\',\'Courier New\',monospace;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#1C1A17;font-size:1.5rem;margin:0 0 12px;">Puzzle 5</h1>' +
                '<p style="color:#6B655B;font-size:0.95rem;margin:0 0 22px;">Enter the authorization code to continue.</p>' +
                '<input id="p5-auth-input" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" ' +
                'aria-label="Authorization code" ' +
                'style="width:100%;box-sizing:border-box;padding:12px 14px;font-size:18px;font-family:inherit;' +
                'text-align:center;letter-spacing:6px;text-transform:uppercase;border:3px solid #1C1A17;border-radius:10px;" />' +
                '<div id="p5-auth-error" style="color:#c62828;font-size:14px;min-height:18px;margin:9px 0 0;"></div>' +
                '<button id="p5-auth-btn" type="button" ' +
                'style="margin-top:12px;width:100%;padding:12px;font-family:\'Silkscreen\',\'Courier New\',monospace;font-size:13px;text-transform:uppercase;letter-spacing:0.5px;color:#FBF3EE;' +
                'background:#d15884;border:3px solid #1C1A17;border-radius:10px;box-shadow:4px 4px 0 #1C1A17;cursor:pointer;">Continue</button>' +
                '</div>';

            (document.body || document.documentElement).appendChild(overlay);

            var input = document.getElementById('p5-auth-input');
            var errEl = document.getElementById('p5-auth-error');
            var btn = document.getElementById('p5-auth-btn');

            function submit() {
                if (input.value.trim().toUpperCase() === AUTH_CODE) {
                    try { sessionStorage.setItem('puzzle5Authorized', 'true'); } catch (e) {}
                    window.location.reload();
                } else {
                    errEl.textContent = 'Incorrect code. Please try again.';
                    input.value = '';
                    input.focus();
                }
            }

            btn.addEventListener('click', submit);
            input.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') { e.preventDefault(); submit(); }
            });
            input.focus();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', buildGate);
        } else {
            buildGate();
        }
    })();
    </script>

    <script>
    // Verify calibration before allowing game play
    (function() {
        // Authorization gate runs first; don't calibrate an unauthorized visitor.
        try { if (sessionStorage.getItem('puzzle5Authorized') !== 'true') return; } catch (e) { return; }
        var calibrated = sessionStorage.getItem('webgazerCalibrationComplete') === 'true';
        var skipped = sessionStorage.getItem('eyeTrackingSkipped') === 'true';
        if (!calibrated && !skipped) {
            var returnUrl = encodeURIComponent(window.location.pathname);
            window.location.href = 'calibration.html?return=' + returnUrl;
        }
    })();
    </script>

    <script>
        // Get or generate shared 4-digit session code (persists across all games in same session)
        let sessionCode = sessionStorage.getItem('gameSessionCode');
        if (!sessionCode) {
            sessionCode = String(Math.floor(1000 + Math.random() * 9000));
            sessionStorage.setItem('gameSessionCode', sessionCode);
        }

        // ===========================
        // PUZZLE 5 - 8x8 grid, "viewing platform" memory puzzle
        // ===========================
        // The player drives one ego vehicle with the arrow keys (one cell per
        // press, 4 directions, blocked by the grid edge - no wrap).
        //
        // Viewing platform: a fixed block of grey cells, per level (level 1: the
        // bottom-left 3x3, cols 1-3 / rows 6-8; level 2: the top-right 3x3, cols
        // 6-8 / rows 1-3). Always visible, walkable.
        //
        // Token cells: the collectibles. By default a token is INVISIBLE unless
        // the ego is currently standing on a platform cell - then every
        // uncollected token is revealed. Off the platform the player sees
        // nothing and must remember where the tokens were. A token flagged
        // `alwaysVisible` is instead drawn in both modes.
        //
        // Shifting: every uncollected token advances one step along a fixed,
        // per-level loop each time the ego makes a move - deterministic and
        // turn-based, regardless of where the ego goes. Hidden tokens keep
        // shifting while hidden. A press blocked by the grid edge is not a move:
        // nothing shifts and the move counter does not change.
        //
        // Collecting: a token is collected when it shares the ego's cell either
        // right after the ego moves OR after the tokens shift that same turn
        // (whichever happens first). A collected token FREEZES on the cell where
        // it was caught, stops shifting, and shows a persistent "collected"
        // marker in both visibility modes.
        //
        // Energy: a frame ring is drawn around the 8x8 play area (not part of
        // the actual game grid) whenever the energy constraint is enabled. Its
        // thickness is per-level - level.energyLayers (default 1): 1 cell thick
        // = 10x10 rendered grid / 36 moves, 2 cells thick = 12x12 / 80 moves.
        // Each move empties one frame cell, sweeping clockwise - the outermost
        // ring first, then inward; blocked presses don't count. Energy resets
        // to full (frame fully refilled) each level. If it empties before every
        // token is collected, the level restarts from scratch. A toggle button
        // (top-left) can disable the constraint entirely - the frame disappears
        // and the grid shrinks back to just 8x8, moves then cost no energy and
        // never trigger a restart; it resets back to enabled (frame back on)
        // every level.
        //
        // Objective: collect every token. The level completes automatically
        // once every token is collected.
        // ===========================

        const BLURB = 'There are no instructions for this game, intentionally.<br>Use the arrow keys to discover the controls, rules, and objective.';

        const GRID_SIZE = 8;
        // Coordinates are 1-based: columns and rows run 1..GRID_SIZE, (1,1) is the
        // top-left cell.

        // Energy frame: a ring of cells around the 8x8 play area, `energyLayers`
        // cells thick, making the whole rendered grid outerSize x outerSize
        // (outerSize = GRID_SIZE + 2 * layers) while the energy constraint is
        // enabled. The frame is not part of the actual game grid - it's drawn
        // (in initGrid) and colored (in updateEnergyFrame) purely to represent
        // energy, in outer (1-based, 1..outerSize) coordinates distinct from the
        // game's own 1..GRID_SIZE. `energyLayers` is per-level (level.energyLayers,
        // default ENERGY_LAYERS_DEFAULT): 1 layer = 36 moves, 2 layers = 80.
        const ENERGY_LAYERS_DEFAULT = 1;

        // One rectangular ring of cells in outer coordinates, clockwise from
        // its top-left corner (min,min): across the top, down the right side,
        // back across the bottom, up the left side.
        function buildRing(min, max) {
            const cells = [];
            for (let x = min; x <= max; x++) cells.push({ x: x, y: min });
            for (let y = min + 1; y <= max; y++) cells.push({ x: max, y: y });
            for (let x = max - 1; x >= min; x--) cells.push({ x: x, y: max });
            for (let y = max - 1; y >= min + 1; y--) cells.push({ x: min, y: y });
            return cells;
        }

        // Geometry for a frame `layers` cells thick. `cells` is the drain order:
        // the outermost ring first (clockwise from its top-left corner), then
        // each ring inward. `outerSize` is the full rendered grid dimension;
        // `max` (= cells.length) is the moves allowed that level before restart.
        function energyGeometry(layers) {
            const outerSize = GRID_SIZE + 2 * layers;
            const cells = [];
            for (let k = 0; k < layers; k++) {
                cells.push(...buildRing(1 + k, outerSize - k));
            }
            return { layers: layers, outerSize: outerSize, cells: cells, max: cells.length };
        }

        // Which [dx, dy] each arrow key applies to the ego vehicle.
        const MOVE_FOR_KEY = {
            ArrowUp:    { dx: 0, dy: -1 },
            ArrowDown:  { dx: 0, dy: 1 },
            ArrowLeft:  { dx: -1, dy: 0 },
            ArrowRight: { dx: 1, dy: 0 }
        };

        // Game state
        let levels = [];
        let currentLevelIndex = 0;
        let isTransitioning = false; // Prevent overlapping level transitions
        let gameState = {
            isPlayable: false,
            egoPos: { x: 1, y: 1 },
            platform: [],   // viewing-platform cells: [{ x, y }, ...] (1-based)
            // runtime tokens: [{ x, y, start, loop, step, alwaysVisible,
            //                    collected, collectedAt }, ...] (1-based)
            tokens: [],
            moveCount: 0,   // ego moves this level (blocked presses excluded)
            // Energy geometry - all four reset from the level's energyLayers on
            // every loadLevel (see energyGeometry).
            energyLayers: ENERGY_LAYERS_DEFAULT,
            energyOuterSize: GRID_SIZE + 2 * ENERGY_LAYERS_DEFAULT,
            energyFrameCells: energyGeometry(ENERGY_LAYERS_DEFAULT).cells,
            energyMax: energyGeometry(ENERGY_LAYERS_DEFAULT).max,
            energyRemaining: energyGeometry(ENERGY_LAYERS_DEFAULT).max,
            energyEnabled: true,         // resets to true on every loadLevel
            colors: {}
        };

        // Data collection
        let sessionData = {
            game: "Game 5",
            legend: {
                "E": "Empty - background cell",
                "P": "Platform - viewing-platform cell (grey, always visible, walkable)",
                "T": "Token - an uncollected token cell. Recorded here at its true position on every turn. Only shown to the player while the ego is on the platform, unless the token is flagged alwaysVisible. Shifts one step along a per-level loop on each ego move (see tokenLoops).",
                "C": "Collected - a token that has been collected; frozen on its collection cell and shown in both visibility modes.",
                "V": "Vehicle - the player's ego vehicle"
            },
            coordinates: {
                "grid": "8x8 grid",
                "origin": "(1,1) is the top-left corner (1-based)",
                "x": "column, increases left to right (1-8)",
                "y": "row, increases top to bottom (1-8)",
                "movement": "Arrow keys move the ego vehicle one cell (Up/Down/Left/Right); a move into the grid edge is blocked and does not count. No wrap.",
                "shifting": "Each uncollected token advances one step along a fixed per-level loop every time the ego moves. A press blocked by the grid edge is not a move and shifts nothing. See sessionData.tokenLoops for the loops.",
                "collection": "A token is collected when it shares the ego's cell right after the ego moves, or after the tokens shift that same turn. Collected tokens freeze on their collection cell and stop shifting. The level ends when every token is collected."
            },
            sessionStart: new Date().toISOString(),
            events: []
        };

        // ---------------------------------------------------------------
        // Level definitions
        //
        // Schema:
        //   egoStart : { x, y }          ego vehicle's start cell (required)
        //   platform : [ { x, y }, ... ]  viewing-platform cells (required; [] = none)
        //   tokens   : [ token, ... ]     collectibles (required; [] = none), where
        //       token = {
        //         start        : { x, y }        start cell (required; == loop[0])
        //         alwaysVisible : boolean         default false. true -> drawn in
        //                                         both modes; false -> only while
        //                                         the ego is on the platform.
        //         loop          : [ { x, y }, ... ] default [start]. Cells the token
        //                                         shifts through, one per ego move,
        //                                         looping forever. Length 1 = static.
        //         color         : string          optional per-token override of
        //                                         colors.token while uncollected.
        //       }
        //   colors   : { ego, platform, token } - a collected token keeps its
        //              token color, it never changes on collection.
        // ---------------------------------------------------------------

        // Standard palette, reused across levels unless a level overrides it.
        const COLORS = {
            ego: '#332288',       // indigo - the player's vehicle
            platform: '#D3D3D3',  // grey   - viewing platform
            token: '#DDCC77'      // gold   - a revealed token (collected or not)
        };

        // Every cell of the w x h rectangle whose top-left corner is (x0, y0),
        // as a list of 1-based { x, y }.
        function rectCells(x0, y0, w, h) {
            const out = [];
            for (let y = y0; y < y0 + h; y++) {
                for (let x = x0; x < x0 + w; x++) {
                    out.push({ x: x, y: y });
                }
            }
            return out;
        }

        function level1() {
            // Viewing platform: the bottom-left 3x3 (columns 1-3, rows 6-8).
            // Ego starts at (3,3), off the platform, so the single static token
            // at (6,6) is hidden until the player drives onto the pad.
            return {
                id: 1,
                name: "Level 1",
                isPlayable: true,
                egoStart: { x: 3, y: 3 },
                platform: rectCells(1, 6, 3, 3),
                tokens: [ { start: { x: 6, y: 6 } } ],
                colors: { ...COLORS, token: '#CC6677' }  // rose
            };
        }

        function level2() {
            // Viewing platform: the top-right 3x3 (columns 6-8, rows 1-3). Ego
            // starts at (1,8), the opposite corner. Introduces "shifting":
            // every uncollected token steps one cell along a fixed loop on each
            // ego move.
            //
            //   Token A - alwaysVisible (both modes). Loop from (3,2):
            //     (3,2) -> (3,3) -> (2,3) -> (2,2) -> repeat
            //   Token B - hidden unless the ego is on the platform; keeps
            //   shifting while hidden. Loop from (6,6):
            //     (6,6) -> (7,6) -> (7,7) -> (6,7) -> repeat
            //
            // A collected token freezes on the cell where it was caught and
            // stops shifting. The level ends when both tokens are collected.
            return {
                id: 2,
                name: "Level 2",
                isPlayable: true,
                egoStart: { x: 1, y: 8 },
                platform: rectCells(6, 1, 3, 3),
                tokens: [
                    {
                        start: { x: 3, y: 2 },
                        alwaysVisible: true,
                        loop: [ { x: 3, y: 2 }, { x: 3, y: 3 }, { x: 2, y: 3 }, { x: 2, y: 2 } ]
                    },
                    {
                        start: { x: 6, y: 6 },
                        alwaysVisible: false,
                        loop: [ { x: 6, y: 6 }, { x: 7, y: 6 }, { x: 7, y: 7 }, { x: 6, y: 7 } ],
                        color: '#BBCC33'  // lime
                    }
                ],
                colors: { ...COLORS, ego: '#ADD8E6' }  // blue
            };
        }

        function level3() {
            // Viewing platform: the bottom-right 2x2 (columns 7-8, rows 7-8).
            // Ego (lavender) starts at (4,5).
            //
            // Token 1 - hidden, orange. Loop (starting the printed cycle at
            // its listed start (2,6)):
            //   (2,6) -> (3,7) -> (4,6) -> (5,7) -> (4,6) -> (3,7) -> (2,6)
            //   -> (1,7) -> repeat
            //
            // Token 2 - NOT hidden (alwaysVisible), magenta. Closed loop
            // (counter-clockwise):
            //   (7,2) -> (6,2) -> (6,3) -> (7,3) -> repeat
            //
            // Token 3 - hidden, yellow. Loop (starting the printed cycle at
            // its listed start (3,3)):
            //   (3,3) -> (3,4) -> (4,4) -> (4,3) -> (4,2) -> (3,2) -> (2,2)
            //   -> (1,2) -> (1,3) -> (1,4) -> (2,4) -> (2,3) -> (2,2) -> (3,2)
            //   -> repeat
            return {
                id: 3,
                name: "Level 3",
                isPlayable: true,
                egoStart: { x: 4, y: 5 },
                platform: rectCells(7, 7, 2, 2),
                tokens: [
                    {
                        start: { x: 2, y: 6 },
                        alwaysVisible: false,
                        loop: [
                            { x: 1, y: 7 }, { x: 2, y: 6 }, { x: 3, y: 7 }, { x: 4, y: 6 },
                            { x: 5, y: 7 }, { x: 4, y: 6 }, { x: 3, y: 7 }, { x: 2, y: 6 }
                        ],
                        color: '#FF5F15'  // orange
                    },
                    {
                        start: { x: 7, y: 2 },
                        alwaysVisible: true,
                        loop: [ { x: 6, y: 3 }, { x: 7, y: 3 }, { x: 7, y: 2 }, { x: 6, y: 2 } ],
                        color: '#882255'  // magenta
                    },
                    {
                        start: { x: 3, y: 3 },
                        alwaysVisible: false,
                        loop: [
                            { x: 1, y: 2 }, { x: 1, y: 3 }, { x: 1, y: 4 }, { x: 2, y: 4 },
                            { x: 2, y: 3 }, { x: 2, y: 2 }, { x: 3, y: 2 }, { x: 3, y: 3 },
                            { x: 3, y: 4 }, { x: 4, y: 4 }, { x: 4, y: 3 }, { x: 4, y: 2 },
                            { x: 3, y: 2 }, { x: 2, y: 2 }
                        ],
                        color: '#DDCC77'  // yellow
                    }
                ],
                colors: { ...COLORS, ego: '#DAB1DA' }  // lavender
            };
        }

        function level4() {
            // Viewing platform: the center 2x2 (columns 4-5, rows 4-5). Ego
            // (pink) starts at (5,8). All three tokens are hidden.
            //
            // Token 1 - turq. Closed 10-cell loop starting at its listed
            // start (8,2):
            //   (8,2) -> (7,2) -> (6,2) -> (5,2) -> (4,2) -> (3,2) -> (3,3)
            //   -> (2,3) -> (2,4) -> (1,4) -> repeat
            //
            // Token 2 - magenta. 12-cell ping-pong loop starting at its
            // listed start (7,4):
            //   (7,4) -> (8,4) -> (8,5) -> (7,5) -> (7,6) -> (8,6) -> (8,7)
            //   -> (7,7) -> (7,6) -> (8,6) -> (8,5) -> (7,5) -> repeat
            //
            // Token 3 - violet. 28-cell ping-pong loop starting at its listed
            // start (3,5):
            //   (3,5) -> (2,5) -> (1,5) -> (1,6) -> (1,7) -> (1,8) -> (2,8)
            //   -> (3,8) -> (4,8) -> (4,7) -> (4,6) -> (3,6) -> (2,6) -> (2,7)
            //   -> (3,7) -> (2,7) -> (2,6) -> (3,6) -> (4,6) -> (4,7) -> (4,8)
            //   -> (3,8) -> (2,8) -> (1,8) -> (1,7) -> (1,6) -> (1,5) -> (2,5)
            //   -> repeat
            return {
                id: 4,
                name: "Level 4",
                isPlayable: true,
                energyLayers: 2,   // double frame ring - 80 moves (levels 1-3 use 1 ring / 36)
                egoStart: { x: 5, y: 8 },
                platform: rectCells(4, 4, 2, 2),
                tokens: [
                    {
                        start: { x: 8, y: 2 },
                        alwaysVisible: false,
                        loop: [
                            { x: 8, y: 2 }, { x: 7, y: 2 }, { x: 6, y: 2 }, { x: 5, y: 2 },
                            { x: 4, y: 2 }, { x: 3, y: 2 }, { x: 3, y: 3 }, { x: 2, y: 3 },
                            { x: 2, y: 4 }, { x: 1, y: 4 }
                        ],
                        color: '#46A3BD'  // turq
                    },
                    {
                        start: { x: 7, y: 4 },
                        alwaysVisible: false,
                        loop: [
                            { x: 7, y: 4 }, { x: 8, y: 4 }, { x: 8, y: 5 }, { x: 7, y: 5 },
                            { x: 7, y: 6 }, { x: 8, y: 6 }, { x: 8, y: 7 }, { x: 7, y: 7 },
                            { x: 7, y: 6 }, { x: 8, y: 6 }, { x: 8, y: 5 }, { x: 7, y: 5 }
                        ],
                        color: '#882255'  // magenta
                    },
                    {
                        start: { x: 3, y: 5 },
                        alwaysVisible: false,
                        loop: [
                            { x: 3, y: 5 }, { x: 2, y: 5 }, { x: 1, y: 5 }, { x: 1, y: 6 },
                            { x: 1, y: 7 }, { x: 1, y: 8 }, { x: 2, y: 8 }, { x: 3, y: 8 },
                            { x: 4, y: 8 }, { x: 4, y: 7 }, { x: 4, y: 6 }, { x: 3, y: 6 },
                            { x: 2, y: 6 }, { x: 2, y: 7 }, { x: 3, y: 7 }, { x: 2, y: 7 },
                            { x: 2, y: 6 }, { x: 3, y: 6 }, { x: 4, y: 6 }, { x: 4, y: 7 },
                            { x: 4, y: 8 }, { x: 3, y: 8 }, { x: 2, y: 8 }, { x: 1, y: 8 },
                            { x: 1, y: 7 }, { x: 1, y: 6 }, { x: 1, y: 5 }, { x: 2, y: 5 }
                        ],
                        color: '#332288'  // violet
                    }
                ],
                colors: { ...COLORS, ego: '#E89EB8' }  // pink
            };
        }

        function blankLevel(id) {
            return {
                id: id,
                name: "Level " + id,
                isPlayable: false,
                egoStart: { x: 1, y: 1 },
                platform: [],
                tokens: [],
                colors: { ...COLORS }
            };
        }

        // Is `pos` on one of this level's viewing-platform cells?
        function isOnPlatform(pos) {
            return gameState.platform.some(c => c.x === pos.x && c.y === pos.y);
        }

        // ---------------------------------------------------------------
        // Grid / rendering
        // ---------------------------------------------------------------

        // Builds (or rebuilds) the #grid DOM. When the energy constraint is
        // enabled, renders energyOuterSize x energyOuterSize: the frame ring
        // (energyLayers cells thick) plus the inner GRID_SIZE x GRID_SIZE play
        // area, each game cell keeping its usual id (`cell-x-y`, 1..GRID_SIZE)
        // regardless of the frame. When disabled, renders just the
        // GRID_SIZE x GRID_SIZE play area with no frame, shrinking back down.
        function initGrid() {
            const gridElement = document.getElementById('grid');
            gridElement.innerHTML = '';
            const showFrame = gameState.energyEnabled;
            const layers = gameState.energyLayers;
            const outerSize = gameState.energyOuterSize;
            const size = showFrame ? outerSize : GRID_SIZE;
            gridElement.style.gridTemplateColumns = `repeat(${size}, 72px)`;
            gridElement.style.gridTemplateRows = `repeat(${size}, 72px)`;
            for (let y = 1; y <= size; y++) {
                for (let x = 1; x <= size; x++) {
                    const cell = document.createElement('div');
                    // The frame is `layers` cells thick, so the play area sits
                    // at outer coords (layers+1)..(outerSize-layers).
                    const isFrame = showFrame && (x <= layers || y <= layers || x > outerSize - layers || y > outerSize - layers);
                    if (isFrame) {
                        cell.className = 'frame-cell';
                        cell.id = `frame-cell-${x}-${y}`;
                    } else {
                        const gx = showFrame ? x - layers : x;
                        const gy = showFrame ? y - layers : y;
                        cell.className = 'cell';
                        cell.id = `cell-${gx}-${gy}`;
                    }
                    gridElement.appendChild(cell);
                }
            }
        }

        function loadLevel(levelIndex) {
            if (levelIndex >= levels.length) {
                return;
            }

            const dashLevel = document.getElementById('dash-level');
            if (dashLevel) dashLevel.textContent = levelIndex + 1;

            // Clear any lingering ripples from the previous level
            document.getElementById('ripple-container').innerHTML = '';

            const level = levels[levelIndex];

            gameState.isPlayable = level.isPlayable;
            gameState.egoPos = { ...level.egoStart };
            gameState.platform = (level.platform || []).map(c => ({ ...c }));
            gameState.tokens = (level.tokens || []).map(t => {
                const start = { ...t.start };
                const loop = (t.loop && t.loop.length)
                    ? t.loop.map(c => ({ x: c.x, y: c.y }))
                    : [ { ...start } ];
                // The level definitions list `start` as loop[0]; find it so the
                // token begins at the right point in its cycle.
                let step = loop.findIndex(c => c.x === start.x && c.y === start.y);
                if (step < 0) step = 0;
                return {
                    x: loop[step].x,
                    y: loop[step].y,
                    start: start,
                    loop: loop,
                    step: step,
                    alwaysVisible: !!t.alwaysVisible,
                    color: t.color || null,
                    collected: false,
                    collectedAt: null
                };
            });
            gameState.moveCount = 0;
            // Energy geometry is per-level: level.energyLayers (default 1)
            // decides how thick the frame ring is and how many moves it buys.
            const geom = energyGeometry(level.energyLayers || ENERGY_LAYERS_DEFAULT);
            gameState.energyLayers = geom.layers;
            gameState.energyOuterSize = geom.outerSize;
            gameState.energyFrameCells = geom.cells;
            gameState.energyMax = geom.max;
            gameState.energyRemaining = geom.max;
            gameState.energyEnabled = true;
            gameState.colors = { ...level.colors };

            const instructionsElement = document.getElementById('instructions');
            instructionsElement.innerHTML = BLURB;
            instructionsElement.style.display = 'block';

            // The previous level may have ended with the frame toggled off;
            // rebuild the grid so a new level always starts framed.
            initGrid();
            renderGrid();
            updateEnergyToggleButton();
            updateEnergyFrame();

            const gridElement = document.getElementById('grid');
            gridElement.classList.remove('fade-out');
            instructionsElement.classList.remove('fade-out');
        }

        function renderGrid() {
            const c = gameState.colors;

            // Reset every cell to empty background
            for (let y = 1; y <= GRID_SIZE; y++) {
                for (let x = 1; x <= GRID_SIZE; x++) {
                    const cell = document.getElementById(`cell-${x}-${y}`);
                    cell.style.backgroundColor = '#FFFFFF';
                    cell.style.borderColor = '#e0e0e0';
                }
            }

            // Viewing platform - always visible.
            for (const p of gameState.platform) {
                const cell = document.getElementById(`cell-${p.x}-${p.y}`);
                if (cell) cell.style.backgroundColor = c.platform || COLORS.platform;
            }

            if (!gameState.isPlayable) return;

            const egoOnPlatform = isOnPlatform(gameState.egoPos);

            // Tokens. A collected token always shows (frozen on its collection
            // cell), keeping its original token color. An uncollected token is
            // drawn as a token if it is alwaysVisible, or if the ego is on the
            // platform; otherwise it is hidden and nothing is drawn.
            for (const t of gameState.tokens) {
                const cell = document.getElementById(`cell-${t.x}-${t.y}`);
                if (!cell) continue;
                if (t.collected || t.alwaysVisible || egoOnPlatform) {
                    cell.style.backgroundColor = t.color || c.token || COLORS.token;
                }
            }

            // Ego vehicle on top.
            const e = gameState.egoPos;
            document.getElementById(`cell-${e.x}-${e.y}`).style.backgroundColor = c.ego || COLORS.ego;
        }

        // Energy toggle button - under the Skip Level button (top-left). Shown
        // on every level while playing, hidden once the game is complete.
        // Resets to "On" every time a level loads.
        function updateEnergyToggleButton() {
            const sw = document.getElementById('energy-switch');
            const input = document.getElementById('energy-switch-input');
            const label = document.getElementById('energy-switch-label');
            if (!sw) return;
            sw.style.display = levels[currentLevelIndex] ? 'inline-flex' : 'none';
            if (input) input.checked = gameState.energyEnabled;
            if (label) label.textContent = 'Energy: ' + (gameState.energyEnabled ? 'On' : 'Off');
        }

        // OLD energy bar - superseded by the perimeter energy frame. Kept,
        // inactive, in case we want it back (the #energy-bar-track/-fill
        // elements it targets are commented out of the HTML/CSS too).
        /*
        function updateEnergyBar() {
            const track = document.getElementById('energy-bar-track');
            const fill = document.getElementById('energy-bar-fill');
            if (!track || !fill) return;
            const show = !!levels[currentLevelIndex] && gameState.energyEnabled;
            track.style.display = show ? 'block' : 'none';
            const pct = Math.max(0, Math.min(1, gameState.energyRemaining / gameState.energyMax)) * 100;
            fill.style.width = pct + '%';
        }
        */

        // Energy frame - the perimeter ring drawn by initGrid() when the
        // energy constraint is enabled. No numbers or labels: cells just go
        // from filled (#1a1a1a) to empty (#e0e0e0) as energy drains, in
        // energyFrameCells order (outermost ring first, each clockwise from its
        // top-left corner). A no-op while the frame doesn't exist in the DOM
        // (constraint disabled).
        function updateEnergyFrame() {
            if (!gameState.energyEnabled) return;
            const drained = gameState.energyMax - gameState.energyRemaining;
            gameState.energyFrameCells.forEach((c, i) => {
                const cell = document.getElementById(`frame-cell-${c.x}-${c.y}`);
                if (!cell) return;
                cell.style.backgroundColor = i < drained ? '#e0e0e0' : '#1a1a1a';
            });
        }

        // ---------------------------------------------------------------
        // Interaction (keyboard only)
        // ---------------------------------------------------------------

        document.addEventListener('keydown', (e) => {
            const delta = MOVE_FOR_KEY[e.key];
            if (!delta) return;

            e.preventDefault();          // arrow keys otherwise scroll the page

            if (e.repeat) return;        // one press = one move; ignore auto-repeat
            if (isTransitioning) return;
            if (currentLevelIndex >= levels.length) return;
            if (!gameState.isPlayable) return;

            moveEgo(e.key, delta.dx, delta.dy);
        });

        // Resolve one arrow-key turn:
        //   1. If the target cell is off the grid, the press is blocked - no
        //      move, no shift, no energy spent.
        //   2. The ego moves one cell; the move counter increments and, if the
        //      energy constraint is enabled, energy drops by one.
        //   3. Any uncollected token now sharing the ego's cell is collected.
        //   4. Every remaining uncollected token shifts one step along its loop.
        //   5. Any token that shifted onto the ego is collected too.
        //   6. Collecting the last token wins the level. Otherwise, if energy
        //      just ran out, the level restarts from scratch.
        function moveEgo(key, dx, dy) {
            const nx = gameState.egoPos.x + dx;
            const ny = gameState.egoPos.y + dy;

            // 1. Blocked by the grid edge.
            if (nx < 1 || nx > GRID_SIZE || ny < 1 || ny > GRID_SIZE) {
                logEvent('blocked', { key: key });
                return;
            }

            // logEvent snapshots the pre-turn state; the outcome is filled in
            // once the turn has resolved.
            logEvent('move', { key: key });
            const evt = sessionData.events[sessionData.events.length - 1];

            // 2. Ego moves.
            gameState.egoPos = { x: nx, y: ny };
            gameState.moveCount++;
            if (gameState.energyEnabled) {
                gameState.energyRemaining = Math.max(0, gameState.energyRemaining - 1);
            }

            // 3. Collect a token the ego stepped onto (before it shifts).
            let collected = collectAtEgo();

            // 4. Remaining uncollected tokens shift one step along their loop.
            shiftTokens();

            // 5. Collect a token that shifted onto the ego this turn.
            collected += collectAtEgo();

            const allCollected = gameState.tokens.length > 0 &&
                                 gameState.tokens.every(t => t.collected);

            const energyDepleted = gameState.energyEnabled && gameState.energyRemaining <= 0;

            evt.outcome = allCollected ? 'win' : (collected > 0 ? 'collect' : 'move');
            evt.tokensAfter = gameState.tokens.map(tokenSnapshot);

            renderGrid();
            updateEnergyFrame();

            if (allCollected) {
                handleWin();
            } else if (energyDepleted) {
                handleEnergyDepleted();
            }
        }

        // Energy ran out before every token was collected - restart the
        // current level from scratch (ego/tokens/energy reset to full).
        function handleEnergyDepleted() {
            logEvent('energy_depleted');
            loadLevel(currentLevelIndex);
        }

        // Collect (and freeze) every uncollected token sharing the ego's cell.
        // Returns how many were collected by this call.
        function collectAtEgo() {
            let n = 0;
            for (const t of gameState.tokens) {
                if (t.collected) continue;
                if (t.x === gameState.egoPos.x && t.y === gameState.egoPos.y) {
                    t.collected = true;
                    t.collectedAt = { x: t.x, y: t.y };
                    n++;
                }
            }
            return n;
        }

        // Advance every uncollected, non-static token one step along its loop.
        function shiftTokens() {
            for (const t of gameState.tokens) {
                if (t.collected || t.loop.length <= 1) continue;
                t.step = (t.step + 1) % t.loop.length;
                t.x = t.loop[t.step].x;
                t.y = t.loop[t.step].y;
            }
        }

        function tokenSnapshot(t) {
            return {
                x: t.x, y: t.y,
                step: t.step,
                alwaysVisible: t.alwaysVisible,
                collected: t.collected
            };
        }

        function handleWin() {
            isTransitioning = true;

            createRipple();

            const gridElement = document.getElementById('grid');
            const instructionsElement = document.getElementById('instructions');
            gridElement.classList.add('fade-out');
            instructionsElement.classList.add('fade-out');

            setTimeout(() => {
                currentLevelIndex++;
                isTransitioning = false;
                if (currentLevelIndex < levels.length) {
                    loadLevel(currentLevelIndex);
                } else {
                    // Game complete - show restart button and upload data
                    gridElement.classList.remove('fade-out');
                    instructionsElement.classList.remove('fade-out');
                    document.getElementById('skip-button').style.display = 'none';
                    document.getElementById('restart-button').style.display = 'block';
                    updateEnergyToggleButton();
                    updateEnergyFrame();
                    handleGameComplete();
                    showCompletionMessage('5');
                }
            }, 800);
        }

        function showCompletionMessage(puzzleLabel) {
            const overlay = document.createElement('div');
            overlay.className = 'completion-overlay';
            overlay.innerHTML = '<div class="completion-card">' +
                '<h2>Congratulations!</h2>' +
                '<p>You completed all levels of Puzzle ' + puzzleLabel + '.</p>' +
                '</div>';
            document.body.appendChild(overlay);
            requestAnimationFrame(() => overlay.classList.add('visible'));

            const colors = ['#e53935','#1e88e5','#43a047','#fdd835','#8e24aa','#fb8c00','#00acc1'];
            for (let i = 0; i < 80; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = Math.random() * 100 + 'vw';
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.animationDuration = (2 + Math.random() * 2) + 's';
                piece.style.animationDelay = Math.random() * 1.5 + 's';
                piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                piece.style.width = (6 + Math.random() * 8) + 'px';
                piece.style.height = (8 + Math.random() * 10) + 'px';
                document.body.appendChild(piece);
            }

            overlay.addEventListener('click', () => {
                overlay.classList.remove('visible');
                setTimeout(() => {
                    overlay.remove();
                    document.querySelectorAll('.confetti-piece').forEach(p => p.remove());
                }, 500);
            });
        }

        // Create ripple effect on win
        function createRipple() {
            const container = document.getElementById('ripple-container');

            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    const ripple = document.createElement('div');
                    ripple.className = 'ripple';
                    ripple.style.animation = 'ripple 1s ease-out forwards';
                    container.appendChild(ripple);

                    setTimeout(() => {
                        ripple.remove();
                    }, 1100);
                }, i * 200);
            }
        }

        // ---------------------------------------------------------------
        // Logging
        // ---------------------------------------------------------------

        function generateGameStateMatrix() {
            // matrix is a plain 0-based array; coordinates are 1-based, so index
            // with -1. 'E' empty, 'P' platform, 'T' uncollected token,
            // 'C' collected token, 'V' ego vehicle. This records ground truth -
            // 'T' is written even when the token is not currently visible to the
            // player. The ego is written last so it wins a shared cell.
            const inBounds = (p) => p.x >= 1 && p.x <= GRID_SIZE && p.y >= 1 && p.y <= GRID_SIZE;
            const matrix = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill('E'));

            for (const p of gameState.platform) {
                if (inBounds(p)) matrix[p.y - 1][p.x - 1] = 'P';
            }
            for (const t of gameState.tokens) {
                if (inBounds(t)) matrix[t.y - 1][t.x - 1] = t.collected ? 'C' : 'T';
            }
            if (gameState.isPlayable && inBounds(gameState.egoPos)) {
                matrix[gameState.egoPos.y - 1][gameState.egoPos.x - 1] = 'V';
            }
            return matrix;
        }

        // The level number to record in the data: the current level's id. Falls
        // back to the raw index once every level is complete (levels[
        // currentLevelIndex] is undefined then).
        function currentLevelId() {
            const lvl = levels[currentLevelIndex];
            return lvl ? lvl.id : currentLevelIndex;
        }

        function logEvent(outcome, detail) {
            // outcome: 'move' | 'collect' | 'blocked' | 'win' | 'skip_level' |
            // 'energy_depleted' | 'energy_enabled' | 'energy_disabled'.
            // For an ego move it is logged as 'move' up front and patched to
            // 'collect' / 'win' once the turn resolves; that same patch adds a
            // `tokensAfter` field. Every *Before field is a snapshot from BEFORE
            // this event applies.
            detail = detail || {};
            sessionData.events.push({
                timestamp: new Date().toISOString(),
                level: currentLevelId(),
                key: detail.key || null,               // 'ArrowUp' | 'ArrowDown' | 'ArrowLeft' | 'ArrowRight' | null
                outcome: outcome,
                moveCountBefore: gameState.moveCount,
                energyRemainingBefore: gameState.energyRemaining,
                energyEnabledBefore: gameState.energyEnabled,
                egoPosBefore: { ...gameState.egoPos },
                egoOnPlatformBefore: isOnPlatform(gameState.egoPos),
                tokensRemainingBefore: gameState.tokens.filter(t => !t.collected).length,
                tokensBefore: gameState.tokens.map(tokenSnapshot),
                gameStateBefore: generateGameStateMatrix()
            });
        }

        // ---------------------------------------------------------------
        // Buttons
        // ---------------------------------------------------------------

        document.getElementById('restart-button').addEventListener('click', () => {
            currentLevelIndex = 0;
            isTransitioning = false;
            document.getElementById('restart-button').style.display = 'none';
            document.getElementById('skip-button').style.display = 'block';
            loadLevel(currentLevelIndex);
        });

        // Energy toggle - flips whether the energy constraint applies. While
        // disabled, energy stops draining and the level never auto-restarts
        // from running out of moves; the frame disappears entirely and the
        // grid shrinks back to just the 8x8 play area. Does not reset the
        // current energy value or the level; loadLevel resets both back to
        // true/full (frame back on) every level.
        document.getElementById('energy-switch-input').addEventListener('change', (e) => {
            if (currentLevelIndex >= levels.length) {
                e.target.checked = gameState.energyEnabled;  // ignore, keep in sync
                return;
            }
            gameState.energyEnabled = e.target.checked;
            logEvent(gameState.energyEnabled ? 'energy_enabled' : 'energy_disabled');
            initGrid();   // frame appears/disappears - the grid DOM must be rebuilt
            renderGrid(); // repaint platform/tokens/ego into the rebuilt cells
            updateEnergyToggleButton();
            updateEnergyFrame();
        });

        // Skip button - advance to the next level without solving it. Mirrors
        // the win transition (same fade + timing) but logs a 'skip_level' event
        // instead of a 'win', and skips the ripple.
        document.getElementById('skip-button').addEventListener('click', () => {
            if (isTransitioning) return;
            if (currentLevelIndex >= levels.length) return;

            logEvent('skip_level');
            isTransitioning = true;

            const gridElement = document.getElementById('grid');
            const instructionsElement = document.getElementById('instructions');
            gridElement.classList.add('fade-out');
            instructionsElement.classList.add('fade-out');

            setTimeout(() => {
                currentLevelIndex++;
                isTransitioning = false;
                if (currentLevelIndex < levels.length) {
                    loadLevel(currentLevelIndex);
                } else {
                    gridElement.classList.remove('fade-out');
                    instructionsElement.classList.remove('fade-out');
                    document.getElementById('skip-button').style.display = 'none';
                    document.getElementById('restart-button').style.display = 'block';
                    updateEnergyToggleButton();
                    updateEnergyFrame();
                    handleGameComplete();
                    showCompletionMessage('5');
                }
            }, 800);
        });

        document.getElementById('download-button').addEventListener('click', () => {
            const participantId = AudioRecorder.promptParticipantId();
            if (participantId === null) return;

            sessionData.sessionEnd = new Date().toISOString();

            // Include transcription data from audio recorder (with safety check)
            sessionData.transcription = (typeof AudioRecorder !== 'undefined' && AudioRecorder.getTranscription)
                ? AudioRecorder.getTranscription()
                : [];

            let dataStr = JSON.stringify(sessionData, null, 2);

            // Post-process to compress gameStateBefore arrays into compact rows
            dataStr = dataStr.replace(
                /"gameStateBefore":\s*\[\s*\[\s*("[A-Z0-9]",?\s*)+\]\s*(,\s*\[\s*("[A-Z0-9]",?\s*)+\]\s*)*\]/g,
                (match) => {
                    const cells = match.match(/"[A-Z0-9]"/g);
                    if (!cells) return match;

                    const rows = [];
                    for (let i = 0; i < cells.length; i += GRID_SIZE) {
                        rows.push('[' + cells.slice(i, i + GRID_SIZE).join(',') + ']');
                    }

                    return '"gameStateBefore": [\n        ' + rows.join(',\n        ') + '\n      ]';
                }
            );

            const dateStr = AudioRecorder.formatDateMMDDYYYY();
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${participantId}_g5_gamestate_${dateStr}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            // Export eye-tracking and audio files
            if (typeof AudioRecorder !== 'undefined' && AudioRecorder.exportRecording) {
                AudioRecorder.exportRecording(participantId, 'g5');
            }
        });

        // ---------------------------------------------------------------
        // S3 upload
        // ---------------------------------------------------------------

        function showUploadStatus(message, type) {
            let statusEl = document.getElementById('upload-status');
            if (!statusEl) {
                statusEl = document.createElement('div');
                statusEl.id = 'upload-status';
                statusEl.style.cssText = 'position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 12px 24px; background: #333; color: white; border-radius: 8px; z-index: 1000; font-family: sans-serif; font-size: 14px; transition: opacity 0.3s;';
                document.body.appendChild(statusEl);
            }
            statusEl.textContent = message;
            statusEl.style.background = type === 'success' ? '#2e7d32' : type === 'error' ? '#c62828' : '#1565c0';
        }

        async function handleGameComplete() {
            sessionData.sessionEnd = new Date().toISOString();
            sessionData.transcription = (typeof AudioRecorder !== 'undefined' && AudioRecorder.getTranscription)
                ? AudioRecorder.getTranscription()
                : [];

            const recorderState = (typeof AudioRecorder !== 'undefined' && AudioRecorder.getState)
                ? AudioRecorder.getState()
                : { gazeData: [], audioChunks: [] };

            const eyeTrackingData = {
                game: sessionData.game,
                dataType: 'eye-tracking',
                sessionStart: sessionData.sessionStart,
                sessionEnd: sessionData.sessionEnd,
                gaze: recorderState.gazeData || []
            };

            if (typeof S3Uploader === 'undefined' || !S3Uploader.getApiUrl()) {
                console.log('S3Uploader not configured. Skipping upload.');
                return;
            }

            showUploadStatus('Uploading session data...', 'uploading');

            const result = await S3Uploader.upload(
                sessionCode,
                sessionData.game,
                sessionData,
                eyeTrackingData,
                recorderState.audioChunks,
                (status) => showUploadStatus(status, 'uploading')
            );

            if (result.success) {
                showUploadStatus('Data uploaded successfully!', 'success');
                setTimeout(() => {
                    const statusEl = document.getElementById('upload-status');
                    if (statusEl) statusEl.style.opacity = '0';
                }, 3000);
            } else {
                showUploadStatus('Upload failed. Use Download button as backup.', 'error');
            }
        }

        // ---------------------------------------------------------------
        // Start
        // ---------------------------------------------------------------
        // The authorization gate at the top of <body> sets this flag when the
        // visitor has not entered the code yet. Don't build the grid, load a
        // level, or start audio/S3 recording until they have. Entering the
        // correct code stores a session flag and reloads, and this block then
        // runs normally.
        if (!window.__puzzle5Unauthorized) {

        levels = [
            level1(),
            level2(),
            level3(),
            level4()
        ];

        // Per-level token loops, for the data. Each uncollected token advances
        // one step along its `loop` on every ego move (a press blocked by the
        // grid edge is not a move). `start` is loop[0]. `alwaysVisible` tokens
        // are drawn in both visibility modes; the rest are only shown while the
        // ego is on the platform. A collected token freezes on its collection
        // cell and stops shifting.
        sessionData.tokenLoops = levels.map(level => ({
            level: level.id,
            tokens: (level.tokens || []).map(t => ({
                start: { ...t.start },
                alwaysVisible: !!t.alwaysVisible,
                loop: (t.loop && t.loop.length ? t.loop : [ t.start ]).map(c => ({ x: c.x, y: c.y }))
            }))
        }));

        initGrid();
        loadLevel(0);

        // Initialize audio recorder
        AudioRecorder.init({
            gamePrefix: 'puzzle-game5',
            gameName: 'Game 5',
            getGameState: function() {
                const egoOnPlatform = isOnPlatform(gameState.egoPos);
                return {
                    level: currentLevelId(),
                    egoPos: { ...gameState.egoPos },
                    egoOnPlatform: egoOnPlatform,
                    moveCount: gameState.moveCount,
                    tokens: gameState.tokens.map(t => ({
                        x: t.x, y: t.y,
                        step: t.step,
                        alwaysVisible: t.alwaysVisible,
                        collected: t.collected,
                        visibleToPlayer: t.collected || t.alwaysVisible || egoOnPlatform
                    })),
                    tokensRemaining: gameState.tokens.filter(t => !t.collected).length,
                    isPlayable: gameState.isPlayable,
                    gameStateMatrix: generateGameStateMatrix()
                };
            },
            screenToGrid: function(screenX, screenY) {
                // Measured off the play-area corner cells rather than #grid
                // itself, since #grid also contains the (non-game) energy
                // frame ring whenever the energy constraint is enabled.
                const topLeft = document.getElementById(`cell-1-1`);
                const bottomRight = document.getElementById(`cell-${GRID_SIZE}-${GRID_SIZE}`);
                if (!topLeft || !bottomRight) return null;
                const tl = topLeft.getBoundingClientRect();
                const br = bottomRight.getBoundingClientRect();
                const rect = { left: tl.left, top: tl.top, right: br.right, bottom: br.bottom };

                if (screenX < rect.left || screenX > rect.right ||
                    screenY < rect.top || screenY > rect.bottom) {
                    return null; // Off grid
                }

                const cellWidth = (rect.right - rect.left) / GRID_SIZE;
                const cellHeight = (rect.bottom - rect.top) / GRID_SIZE;
                // 1-based grid coordinates (1..GRID_SIZE)
                const gridX = Math.floor((screenX - rect.left) / cellWidth) + 1;
                const gridY = Math.floor((screenY - rect.top) / cellHeight) + 1;

                return { x: Math.min(gridX, GRID_SIZE), y: Math.min(gridY, GRID_SIZE) };
            },
            insertBeforeSelector: '#dashboard',
            onRecordingStart: () => {
                S3Uploader.startBackups(sessionCode, 'Game 5', () => AudioRecorder.getState().audioChunks);
            },
            onRecordingStop: () => {
                S3Uploader.stopBackups();
            }
        });

        } // end authorized-only Start block
    </script>

    <script>
        // Dashboard puzzle switcher - confirm with a "Quit puzzle?" dialog
        // before navigating away.
        (function () {
            var select = document.getElementById('dash-puzzle');
            var home = document.getElementById('dash-home');
            var overlay = document.getElementById('quit-overlay');
            if (!overlay) return;
            var CURRENT = 'game5.html';
            var pending = null;

            function askQuit(target) {
                pending = target;
                overlay.hidden = false;
                requestAnimationFrame(function () { overlay.classList.add('visible'); });
            }

            if (select) select.addEventListener('change', function () {
                var target = this.value;
                this.value = CURRENT;                 // revert until confirmed
                if (target && target !== CURRENT) askQuit(target);
            });

            if (home) home.addEventListener('click', function (e) {
                e.preventDefault();
                askQuit(home.getAttribute('href') || 'index.html');
            });

            document.getElementById('quit-confirm').addEventListener('click', function () {
                if (pending) window.location.href = pending;
            });
            document.getElementById('quit-cancel').addEventListener('click', function () {
                overlay.classList.remove('visible');
                setTimeout(function () { overlay.hidden = true; }, 400);
                pending = null;
            });
        })();
    </script>
</body>
</html>
